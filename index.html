<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日本地図クイズ — Japan Map Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --red: #E84040;
  --red-dark: #B52E2E;
  --red-light: #FFF0F0;
  --navy: #12213A;
  --navy-mid: #1E3254;
  --gold: #F5A623;
  --gold-light: #FFF8E7;
  --green: #27AE60;
  --green-light: #E8F8EF;
  --bg: #F5F4F0;
  --white: #FFFFFF;
  --text: #1A1A2E;
  --text-muted: #6B7280;
  --border: #E2E0DA;
  --shadow: 0 2px 12px rgba(18,33,58,0.10);
  --shadow-lg: 0 8px 32px rgba(18,33,58,0.16);
  --ink: #12213A;          /* dark-blue text (headings, numbers) */
  --radius: 14px;
  --radius-sm: 8px;
}

/* ── DARK THEME ── */
[data-theme="dark"] {
  --bg: #0F1923;
  --white: #1A2535;
  --text: #E8EDF5;
  --text-muted: #7B8FA8;
  --border: #2A3A50;
  --shadow: 0 2px 12px rgba(0,0,0,0.4);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.5);
  --navy: #0A1628;
  --navy-mid: #12213A;
  --gold-light: #2A2010;
  --green-light: #0D2018;
  --red-light: #2A1010;
  --ink: #E8EDF5;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Space Grotesk', 'Noto Sans JP', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

/* ── HEADER ── */
header {
  background: var(--navy);
  padding: 0 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 58px;
  position: sticky;
  top: 0;
  z-index: 100;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  color: #fff;
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.3px;
}

.logo .dot {
  width: 10px;
  height: 10px;
  background: var(--red);
  border-radius: 50%;
}

.header-right { display: flex; align-items: center; gap: 10px; }
.lang-bar { display: flex; gap: 4px; }

/* Theme toggle */
.theme-btn {
  width: 34px; height: 34px;
  border-radius: 50%;
  border: 1.5px solid rgba(255,255,255,0.2);
  background: transparent;
  color: rgba(255,255,255,0.7);
  font-size: 16px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
  flex-shrink: 0;
}
.theme-btn:hover { background: rgba(255,255,255,0.12); color: #fff; }

.lang-btn {
  padding: 5px 13px;
  border-radius: 20px;
  border: 1.5px solid rgba(255,255,255,0.2);
  background: transparent;
  color: rgba(255,255,255,0.65);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.15s;
}

.lang-btn.active, .lang-btn:hover {
  background: var(--red);
  border-color: var(--red);
  color: #fff;
}

/* ── SCREENS ── */
.screen { display: none; }
.screen.visible { display: block; }

/* ── START SCREEN ── */
#start-screen {
  max-width: 540px;
  margin: 0 auto;
  padding: 40px 20px 60px;
  text-align: center;
}

.hero-flag {
  width: 72px;
  height: 72px;
  background: var(--white);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 24px;
  border: 3px solid var(--border);
  box-shadow: var(--shadow);
}

.hero-flag svg { width: 44px; height: 30px; }

#start-screen h1 {
  font-size: 34px;
  font-weight: 900;
  line-height: 1.15;
  margin-bottom: 10px;
  letter-spacing: -0.5px;
  color: var(--ink);
}

#start-screen h1 span { color: var(--red); }

#start-screen p {
  font-size: 15px;
  color: var(--text-muted);
  margin-bottom: 32px;
  line-height: 1.6;
}

.start-card {
  background: var(--white);
  border-radius: var(--radius);
  padding: 28px;
  box-shadow: var(--shadow-lg);
  text-align: left;
}

.field-label {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 8px;
  display: block;
}

.name-input {
  width: 100%;
  padding: 12px 14px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 15px;
  font-family: inherit;
  color: var(--text);
  background: var(--bg);
  outline: none;
  transition: border-color 0.15s;
  margin-bottom: 20px;
}

.name-input:focus { border-color: var(--red); }

.difficulty-row {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
  margin-bottom: 20px;
}

.diff-btn {
  padding: 10px 8px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--bg);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  color: var(--text-muted);
  text-align: center;
  transition: all 0.15s;
}

.diff-btn.active {
  background: var(--navy);
  border-color: var(--ink);
  color: #fff;
}

.diff-btn small { display: block; font-size: 11px; font-weight: 400; margin-top: 2px; }

.start-btns {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.start-btn {
  padding: 14px;
  background: var(--red);
  color: #fff;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  transition: background 0.15s, transform 0.1s;
  letter-spacing: 0.2px;
}

.start-btn:hover { background: var(--red-dark); }
.start-btn:active { transform: scale(0.98); }

.study-btn {
  padding: 14px;
  background: var(--white);
  color: var(--ink);
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.15s;
}

.study-btn:hover { border-color: var(--ink); background: #F0F3FA; }

.stats-row {
  display: flex;
  justify-content: center;
  gap: 32px;
  margin-top: 32px;
}

.stat-item { text-align: center; }
.stat-num { font-size: 26px; font-weight: 700; color: var(--ink); }
.stat-lbl { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

/* ── HISTORY OPEN BTN (start screen) ── */
.history-open-btn {
  width: 100%;
  margin-top: 10px;
  padding: 10px;
  background: transparent;
  color: var(--text-muted);
  border: 1.5px dashed var(--border);
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.15s;
}
.history-open-btn:hover { border-color: var(--ink); color: var(--ink); background: #F0F3FA; }

/* ── HISTORY MODAL ── */
#history-modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(18,33,58,0.55);
  z-index: 200;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
#history-modal.open { display: flex; }
.history-modal-box {
  background: var(--white);
  border-radius: var(--radius);
  width: 100%;
  max-width: 480px;
  box-shadow: var(--shadow-lg);
  overflow: hidden;
}
.hm-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
  background: var(--navy);
  color: #fff;
}
.hm-header h3 { font-size: 16px; font-weight: 700; }
.hm-close {
  background: none;
  border: none;
  color: rgba(255,255,255,0.7);
  font-size: 22px;
  cursor: pointer;
  line-height: 1;
  padding: 0 2px;
}
.hm-close:hover { color: #fff; }
.hm-body { padding: 0; max-height: 70vh; overflow-y: auto; }
.hm-empty { padding: 32px; text-align: center; color: var(--text-muted); font-size: 14px; }
.hm-row {
  display: flex;
  align-items: center;
  padding: 12px 20px;
  border-bottom: 1px solid var(--border);
  gap: 12px;
  font-size: 14px;
}
.hm-row:last-child { border-bottom: none; }
.hm-date { color: var(--text-muted); font-size: 11px; min-width: 90px; }
.hm-name { flex: 1; font-weight: 500; }
.hm-score { font-weight: 700; color: var(--ink); }
.hm-pct { font-size: 12px; padding: 3px 8px; border-radius: 10px; font-weight: 700; }
.hm-pct.great { background: var(--green-light); color: #1a6b3c; }
.hm-pct.ok    { background: var(--gold-light);  color: #8a6200; }
.hm-pct.low   { background: var(--red-light);   color: var(--red-dark); }
/* Player groups in history */
.hp-player { border-bottom: 1px solid var(--border); }
.hp-player:last-child { border-bottom: none; }
.hp-head {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 20px; cursor: pointer; transition: background 0.12s;
}
.hp-head:hover { background: var(--bg); }
.hp-avatar {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--navy); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 15px; flex-shrink: 0;
}
.hp-info { flex: 1; min-width: 0; }
.hp-name { font-weight: 700; font-size: 15px; }
.hp-meta { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
.hp-best { text-align: right; }
.hp-best-num { font-weight: 800; font-size: 16px; color: var(--ink); }
.hp-best-lbl { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
.hp-arrow { color: var(--text-muted); font-size: 12px; transition: transform 0.2s; }
.hp-player.open .hp-arrow { transform: rotate(90deg); }
.hp-games { display: none; background: var(--bg); }
.hp-player.open .hp-games { display: block; }
.hp-games .hm-row { padding: 9px 20px 9px 68px; font-size: 13px; }
[data-theme="dark"] .hp-best-num, [data-theme="dark"] .hm-score { color: var(--text); }
[data-theme="dark"] .hp-avatar { background: #3A5A8A; }
.hm-footer { padding: 12px 20px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; }
.hm-clear-btn {
  padding: 8px 16px;
  background: none;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 13px;
  color: var(--text-muted);
  cursor: pointer;
  font-family: inherit;
}
.hm-clear-btn:hover { border-color: var(--red); color: var(--red); }

/* ── STUDY SCREEN ── */
#study-screen { max-width: 880px; margin: 0 auto; padding: 24px 16px 60px; }

.study-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  flex-wrap: wrap;
  gap: 10px;
}

.study-header h2 { font-size: 20px; font-weight: 700; color: var(--ink); }

.study-layout {
  display: grid;
  grid-template-columns: 1fr 340px;
  gap: 16px;
  align-items: start;
}

@media (max-width: 700px) {
  .study-layout { grid-template-columns: 1fr; }
}

.study-map-card {
  background: var(--white);
  border-radius: var(--radius);
  padding: 12px;
  box-shadow: var(--shadow);
  border: 1.5px solid var(--border);
}

#study-jmap { width: 100%; display: block; }

/* Right panel in study mode */
.study-right { display: flex; flex-direction: column; gap: 12px; }

.study-info-panel {
  background: var(--navy);
  border-radius: var(--radius);
  padding: 0;
  color: #fff;
  display: none;
  overflow: hidden;
}

.study-info-panel.show { display: block; }

.sip-flag-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px 18px 12px;
  border-bottom: 1px solid rgba(255,255,255,0.1);
}

.sip-num {
  width: 36px;
  height: 36px;
  background: rgba(255,255,255,0.12);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 700;
  color: rgba(255,255,255,0.7);
  flex-shrink: 0;
}

.sip-name-block {}
.sip-name { font-size: 20px; font-weight: 800; line-height: 1.1; }
.sip-name-sub { font-size: 13px; color: rgba(255,255,255,0.55); margin-top: 2px; }

.sip-body { padding: 14px 18px; display: flex; flex-direction: column; gap: 10px; }

.sip-row {
  display: flex;
  gap: 10px;
  align-items: flex-start;
}

.sip-icon { font-size: 16px; width: 22px; flex-shrink: 0; margin-top: 1px; }
.sip-row-content {}
.sip-row-label { font-size: 11px; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 2px; }
.sip-row-val { font-size: 13px; color: rgba(255,255,255,0.9); line-height: 1.45; }
.sip-row-val strong { color: var(--gold); }

.sip-region-badge {
  display: inline-block;
  background: rgba(255,255,255,0.12);
  border-radius: 12px;
  padding: 2px 10px;
  font-size: 12px;
  color: rgba(255,255,255,0.8);
  margin-top: 4px;
}

/* Empty state for study panel */
.study-empty-panel {
  background: var(--white);
  border-radius: var(--radius);
  padding: 28px 20px;
  text-align: center;
  border: 1.5px dashed var(--border);
  color: var(--text-muted);
}
.study-empty-panel .big-icon { font-size: 36px; margin-bottom: 10px; }
.study-empty-panel p { font-size: 13px; line-height: 1.6; }

.study-legend {
  background: var(--white);
  border-radius: var(--radius);
  padding: 12px;
  box-shadow: var(--shadow);
  border: 1.5px solid var(--border);
  max-height: 320px;
  overflow-y: auto;
}

.study-legend-title {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-muted);
  margin-bottom: 8px;
  padding: 0 4px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 8px;
  border-radius: 6px;
  cursor: pointer;
  transition: background 0.12s;
  font-size: 13px;
}

.legend-item:hover { background: var(--bg); }
.legend-item.active { background: var(--red-light); }

.legend-num {
  width: 22px;
  font-size: 11px;
  font-weight: 700;
  color: var(--text-muted);
  text-align: right;
  flex-shrink: 0;
}

.legend-item.active .legend-num { color: var(--red); }

.legend-name { font-weight: 600; }
.legend-sub { font-size: 11px; color: var(--text-muted); }

.study-info-panel.show { display: block; }
.sip-cap { font-size: 13px; color: rgba(255,255,255,0.6); margin-bottom: 8px; }
.sip-fact { font-size: 14px; color: rgba(255,255,255,0.85); line-height: 1.55; }

/* ── QUIZ SCREEN ── */
#quiz-screen { max-width: 700px; margin: 0 auto; padding: 20px 16px 40px; }

.quiz-topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}

.progress-track {
  flex: 1;
  height: 6px;
  background: var(--border);
  border-radius: 3px;
  overflow: hidden;
  margin: 0 14px;
}

.progress-fill {
  height: 100%;
  background: var(--red);
  border-radius: 3px;
  transition: width 0.4s;
}

.score-badge {
  background: var(--navy);
  color: #fff;
  border-radius: 20px;
  padding: 4px 13px;
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
}

.q-counter {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-muted);
  white-space: nowrap;
}

/* Timer */
.timer-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin-bottom: 10px;
}

.timer-circle {
  position: relative;
  width: 52px;
  height: 52px;
  flex-shrink: 0;
}

.timer-circle svg {
  position: absolute;
  top: 0; left: 0;
  transform: rotate(-90deg);
}

.timer-circle .timer-bg {
  fill: none;
  stroke: var(--border);
  stroke-width: 4;
}

.timer-circle .timer-arc {
  fill: none;
  stroke: var(--red);
  stroke-width: 4;
  stroke-linecap: round;
  stroke-dasharray: 132;
  stroke-dashoffset: 0;
  transition: stroke-dashoffset 1s linear, stroke 0.3s;
}

.timer-circle .timer-arc.warn { stroke: var(--gold); }
.timer-circle .timer-arc.danger { stroke: var(--red); }

.timer-num {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  font-weight: 700;
  color: var(--ink);
}

.timer-num.warn { color: var(--gold); }
.timer-num.danger { color: var(--red); }

/* Hint button */
.hint-row {
  display: flex;
  justify-content: flex-end;
  margin-bottom: 8px;
}

.hint-btn {
  padding: 6px 14px;
  background: var(--gold-light);
  border: 1.5px solid var(--gold);
  border-radius: 20px;
  font-size: 13px;
  font-weight: 600;
  color: #8a6200;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.15s;
  display: flex;
  align-items: center;
  gap: 6px;
}

.hint-btn:hover:not(:disabled) { background: var(--gold); color: #fff; }
.hint-btn:disabled { opacity: 0.4; cursor: default; }

/* Map */
.map-card {
  background: var(--white);
  border-radius: var(--radius);
  padding: 12px;
  box-shadow: var(--shadow);
  margin-bottom: 14px;
  border: 1.5px solid var(--border);
}

#jmap { width: 100%; display: block; }

/* Question */
.q-label {
  text-align: center;
  font-size: 15px;
  color: var(--text-muted);
  margin-bottom: 14px;
  font-weight: 500;
}

.q-label strong { color: var(--red); }

/* Options */
#options {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 14px;
}

.opt {
  padding: 13px 14px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--white);
  color: var(--text);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  text-align: left;
  font-family: inherit;
  transition: all 0.15s;
  line-height: 1.4;
  box-shadow: var(--shadow);
}

.opt:hover:not(:disabled) {
  border-color: var(--ink);
  background: #F0F3FA;
  transform: translateY(-1px);
}

.opt:disabled { cursor: default; transform: none !important; }

.opt.correct {
  background: var(--green-light);
  border-color: var(--green);
  color: #1a6b3c;
}

.opt.wrong {
  background: #FFF0F0;
  border-color: var(--red);
  color: var(--red-dark);
}

.opt.eliminated {
  opacity: 0.25;
  pointer-events: none;
}

.opt .opt-jp { font-weight: 700; font-size: 15px; display: block; }
.opt .opt-en { font-size: 12px; color: var(--text-muted); display: block; margin-top: 2px; }

/* Info card */
.info-card {
  display: none;
  background: var(--navy);
  border-radius: var(--radius-sm);
  padding: 14px 16px;
  margin-bottom: 12px;
  color: #fff;
}

.info-card .ic-name { font-size: 16px; font-weight: 700; margin-bottom: 3px; }
.info-card .ic-cap { font-size: 12px; color: rgba(255,255,255,0.6); margin-bottom: 8px; }
.info-card .ic-fact { font-size: 13px; color: rgba(255,255,255,0.85); line-height: 1.55; }

/* Feedback */
#feedback {
  text-align: center;
  font-size: 14px;
  font-weight: 600;
  min-height: 20px;
  margin-bottom: 10px;
  color: var(--text-muted);
}

#feedback.ok { color: var(--green); }
#feedback.fail { color: var(--red); }

.next-btn {
  display: none;
  width: 100%;
  padding: 13px;
  background: var(--navy);
  color: #fff;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  transition: background 0.15s;
  letter-spacing: 0.2px;
}

.next-btn:hover { background: var(--navy-mid); }

/* ── RESULT SCREEN ── */
#result-screen {
  max-width: 580px;
  margin: 0 auto;
  padding: 32px 20px 60px;
  text-align: center;
}

.result-hero {
  background: var(--navy);
  border-radius: var(--radius);
  padding: 32px 24px;
  color: #fff;
  margin-bottom: 20px;
}

}

/* History card */

}

.history-title {
  padding: 12px 16px;
  background: var(--bg);
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;

  color: var(--text-muted);
  border-bottom: 1px solid var(--border);
}

.history-row {

  align-items: center;

}

.history-row:last-child { border-bottom: none; }

}

.history-pct.great { background: var(--green-light); color: #1a6b3c; }
.history-pct.ok { background: var(--gold-light); color: #8a6200; }
.history-pct.low { background: var(--red-light); color: var(--red-dark); }

.result-btns {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.btn-secondary {
  padding: 13px;
  background: var(--white);
  color: var(--ink);
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.15s;
}

.btn-secondary:hover { border-color: var(--ink); background: #F0F3FA; }

.btn-primary {
  padding: 13px;
  background: var(--red);
  color: #fff;
  border: none;
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  transition: background 0.15s;
}

.btn-primary:hover { background: var(--red-dark); }

/* Loading */
#loading-overlay {
  position: fixed;
  inset: 0;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 999;
}

.spinner {
  width: 40px;
  height: 40px;
  border: 3px solid var(--border);
  border-top-color: var(--red);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-bottom: 14px;
}

@keyframes spin { to { transform: rotate(360deg); } }
#loading-overlay p { color: var(--text-muted); font-size: 14px; }

/* ── CONFETTI ── */
#confetti-container {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 500;
  overflow: hidden;
}

.confetti-piece {
  position: absolute;
  width: 10px;
  height: 10px;
  top: -20px;
  opacity: 0;
  animation: confettiFall linear forwards;
}

@keyframes confettiFall {
  0%   { opacity: 1; transform: translateY(0) rotate(0deg); }
  100% { opacity: 0; transform: translateY(110vh) rotate(720deg); }
}

/* Map label tooltip (study mode) */
.map-label {
  font-size: 9px;
  font-weight: 700;
  fill: var(--navy);
  pointer-events: none;
  text-anchor: middle;
  dominant-baseline: middle;
}

/* ── STREAK BADGE ── */
.streak-badge {
  display: none;
  align-items: center;
  gap: 5px;
  background: linear-gradient(135deg, #FF6B35, #F5A623);
  color: #fff;
  border-radius: 20px;
  padding: 4px 12px;
  font-size: 13px;
  font-weight: 700;
  animation: streakPop 0.3s cubic-bezier(0.34,1.56,0.64,1);
}
.streak-badge.show { display: flex; }
@keyframes streakPop {
  0% { transform: scale(0.5); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

/* ── REGION STATS ── */
.region-stats-card {
  background: var(--white);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow);
  margin-bottom: 20px;
  text-align: left;
  border: 1.5px solid var(--border);
}
.rs-title {
  padding: 12px 16px;
  background: var(--bg);
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--text-muted);
  border-bottom: 1px solid var(--border);
}
.rs-body { padding: 12px 16px; display: flex; flex-direction: column; gap: 9px; }
.rs-row { display: flex; align-items: center; gap: 10px; }
.rs-name { width: 60px; font-size: 12px; font-weight: 600; color: var(--text); flex-shrink: 0; }
.rs-bar-track { flex: 1; height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
.rs-bar-fill { height: 100%; border-radius: 4px; transition: width 0.6s ease; }
.rs-pct { width: 36px; font-size: 12px; font-weight: 700; text-align: right; flex-shrink: 0; }


/* ── MODE / REGION / WEAK (start screen) ── */
.mode-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 20px; }
.mode-btn {
  padding: 12px 10px; border: 1.5px solid var(--border); border-radius: var(--radius-sm);
  background: var(--bg); cursor: pointer; font-family: inherit; color: var(--text-muted);
  font-size: 14px; font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 2px;
  transition: all 0.15s;
}
.mode-btn .mode-ic { font-size: 22px; }
.mode-btn small { font-size: 11px; font-weight: 400; }
.mode-btn.active { border-color: var(--red); background: var(--red-light); color: var(--red-dark); }
.region-select {
  width: 100%; padding: 11px 12px; border: 1.5px solid var(--border); border-radius: var(--radius-sm);
  font-size: 14px; font-family: inherit; color: var(--text); background: var(--bg);
  margin-bottom: 14px; cursor: pointer; outline: none;
}
.region-select:focus { border-color: var(--red); }
.weak-toggle {
  display: flex; align-items: center; gap: 12px; padding: 10px 12px; margin-bottom: 20px;
  border: 1.5px solid var(--border); border-radius: var(--radius-sm); cursor: pointer; background: var(--bg);
}
.weak-toggle input { width: 18px; height: 18px; accent-color: var(--red); flex-shrink: 0; cursor: pointer; }
.weak-toggle b { display: block; font-size: 14px; color: var(--text); }
.weak-toggle small { font-size: 12px; color: var(--text-muted); }
.weak-toggle:has(input:checked) { border-color: var(--red); background: var(--red-light); }
.sub-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
.sub-btns .history-open-btn { margin-top: 0; }

/* ── MAP MODE (quiz) ── */
.map-q { font-size: 16px; margin-bottom: 10px; }
.q-target { font-size: 24px; font-weight: 900; color: var(--red); padding: 0 4px; }
.q-target-sub { font-size: 13px; color: var(--text-muted); font-weight: 500; margin-right: 6px; }
#jmap.clickable { cursor: crosshair; }
.hm-tag { font-size: 12px; color: var(--text-muted); white-space: nowrap; }

/* ── ACHIEVEMENTS ── */
#ach-modal {
  display: none; position: fixed; inset: 0; background: rgba(18,33,58,0.55);
  z-index: 200; align-items: center; justify-content: center; padding: 20px;
}
#ach-modal.open { display: flex; }
.ach-box { max-width: 580px; }
.ach-count { font-size: 12px; background: var(--gold); color: #fff; border-radius: 10px; padding: 2px 8px; margin-left: 6px; vertical-align: 2px; }
.ach-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 16px; }
.ach-card {
  border: 1.5px solid var(--border); border-radius: 10px; padding: 12px;
  display: flex; gap: 10px; align-items: flex-start; background: var(--white);
}
.ach-card .a-ic { font-size: 26px; line-height: 1; }
.ach-card .a-name { font-weight: 700; font-size: 13px; }
.ach-card .a-desc { font-size: 11px; color: var(--text-muted); margin-top: 2px; line-height: 1.4; }
.ach-card .a-date { font-size: 11px; color: var(--green); margin-top: 4px; font-weight: 700; }
.ach-card.locked { opacity: 0.55; }
.ach-card.got { border-color: var(--gold); background: var(--gold-light); }
.ach-bar { height: 6px; background: var(--border); border-radius: 3px; margin-top: 6px; overflow: hidden; }
.ach-bar div { height: 100%; background: var(--gold); border-radius: 3px; }
.new-ach-card { border-color: var(--gold); }
.new-ach-card .rs-row { gap: 12px; }

#toast-wrap {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
  z-index: 600; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none;
}
.toast {
  display: flex; align-items: center; gap: 12px; background: #12213A; color: #fff;
  border-radius: 14px; padding: 12px 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  border: 2px solid var(--gold); min-width: 260px;
  animation: toastIn 0.45s cubic-bezier(0.34,1.56,0.64,1);
}
.toast .t-ic { font-size: 30px; }
.toast .t-top { font-size: 11px; color: var(--gold); text-transform: uppercase; letter-spacing: 0.6px; font-weight: 700; }
.toast .t-name { font-size: 16px; font-weight: 700; }
.toast.out { animation: toastOut 0.3s forwards; }
@keyframes toastIn { from { transform: translateY(40px) scale(0.9); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes toastOut { to { transform: translateY(20px); opacity: 0; } }

/* ── STUDY: progress view ── */
.study-view-toggle { display: flex; background: var(--white); border: 1.5px solid var(--border); border-radius: 20px; padding: 3px; }
.svt-btn {
  border: none; background: transparent; padding: 6px 12px; border-radius: 16px;
  font-size: 13px; font-weight: 600; color: var(--text-muted); cursor: pointer; font-family: inherit;
}
.svt-btn.active { background: var(--navy); color: #fff; }
.progress-legend { display: none; flex-wrap: wrap; gap: 6px 14px; padding: 10px 6px 2px; font-size: 12px; color: var(--text-muted); align-items: center; }
.progress-legend.show { display: flex; }
.pl-sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; margin-right: 5px; vertical-align: -1px; }
.pl-summary { width: 100%; font-weight: 700; color: var(--text); font-size: 13px; }

[data-theme="dark"] .mode-btn, [data-theme="dark"] .region-select, [data-theme="dark"] .weak-toggle { background: #0F1923; }
[data-theme="dark"] .mode-btn.active { background: #2A1010; color: #FF8A8A; }
[data-theme="dark"] .weak-toggle:has(input:checked) { background: #2A1010; }
[data-theme="dark"] .svt-btn.active { background: #3A5A8A; }
[data-theme="dark"] .ach-card.got { background: #2A2010; }

@media (max-width: 480px) {
  .ach-grid { grid-template-columns: 1fr; }
  .sub-btns { grid-template-columns: 1fr; }
}

/* ── HEADER ON PHONES ── */
.lb-short { display: none; }
.logo span, .lang-btn { white-space: nowrap; }
@media (max-width: 600px) {
  header { padding: 0 12px; height: 54px; }
  .logo { font-size: 15px; gap: 8px; }
  .logo .dot { width: 8px; height: 8px; }
  .header-right { gap: 6px; }
  .lang-bar { gap: 3px; }
  .lang-btn { padding: 5px 9px; font-size: 12px; }
  .lb-full { display: none; }
  .lb-short { display: inline; }
  .theme-btn { width: 32px; height: 32px; font-size: 15px; }
}

/* dark mode fixes */
[data-theme="dark"] .study-btn:hover,
[data-theme="dark"] .btn-secondary:hover,
[data-theme="dark"] .history-open-btn:hover { background: #22344A; border-color: #5B7BA6; color: var(--ink); }
[data-theme="dark"] .name-input { background: #0F1923; color: var(--text); border-color: var(--border); }
[data-theme="dark"] .opt { background: var(--white); color: var(--text); }
[data-theme="dark"] .opt:hover:not(:disabled) { background: #22344A; }
[data-theme="dark"] .diff-btn { background: #0F1923; color: var(--text-muted); }
[data-theme="dark"] .diff-btn.active { background: #3A5A8A; border-color: #3A5A8A; color: #fff; }
[data-theme="dark"] .study-empty-panel { background: var(--white); }
[data-theme="dark"] .lb-row.me { background: #1a2a40; }
[data-theme="dark"] .hm-row { border-color: var(--border); }
[data-theme="dark"] .history-modal-box { background: var(--white); }
[data-theme="dark"] .hm-body { background: var(--white); }
[data-theme="dark"] #loading-overlay { background: #0F1923; }

@media (max-width: 480px) {
  #options { grid-template-columns: 1fr; }
  #start-screen h1 { font-size: 28px; }
  .result-btns { grid-template-columns: 1fr; }
  .difficulty-row { grid-template-columns: 1fr; }
  .start-btns { grid-template-columns: 1fr; }
}

// ── Audio (Web Audio API) ──
function getAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playTone(freq, type, duration, vol = 0.15, delay = 0) {
  try {
    const ctx = getAudio();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type = type;
    o.frequency.value = freq;
    g.gain.setValueAtTime(vol, ctx.currentTime + delay);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + duration);
    o.start(ctx.currentTime + delay);
    o.stop(ctx.currentTime + delay + duration);
  } catch(e){}
}

// ── Timer ──
function startTimer() {
  stopTimer();
  timerSec = timerMax;
  updateTimerUI();
  timerInterval = setInterval(() => {
    timerSec--;
    updateTimerUI();
    if (timerSec <= 5 && timerSec > 0) soundTick();
    if (timerSec <= 0) {
      stopTimer();
      onTimeout();
    }
  }, 1000);
}

function stopTimer() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
}

function updateTimerUI() {
  const arc = document.getElementById("timer-arc");
  const num = document.getElementById("timer-num");
  if (!arc || !num) return;
  const circumference = 132;
  const pct = timerSec / timerMax;
  arc.style.strokeDashoffset = circumference * (1 - pct);
  num.textContent = timerSec;

  const isDanger = timerSec <= 4;
  const isWarn = !isDanger && timerSec <= timerMax / 2;
  arc.className.baseVal = "timer-arc" + (isDanger ? " danger" : isWarn ? " warn" : "");
  num.className = "timer-num" + (isDanger ? " danger" : isWarn ? " warn" : "");
}

function onTimeout() {
  if (answered) return;
  questions[current].picked = null;
  finishAnswer(false, null, true);
}

// ── Streak ──
function updateStreak(correct) {
  if (correct) {
    streak++;
    bestStreak = Math.max(bestStreak, streak);
    if (streak === 5) unlock("streak5");
    if (streak === 10) unlock("streak10");
  } else {
    streak = 0;
  }
  const badge = document.getElementById("streak-badge");
  if (!badge) return;
  if (streak >= 2) {
    badge.innerHTML = `${streak >= 5 ? "⚡" : "🔥"} <span id="streak-num">${streak}</span>`;
    badge.className = "streak-badge";
    void badge.offsetWidth; // retrigger pop animation
    badge.className = "streak-badge show";
  } else {
    badge.className = "streak-badge";
  }
}

// ── Hint ──
// 4択: removes 2 wrong options. Map mode: highlights 3 candidates (1 correct).
function useHint() {
  if (hintUsed || answered || hintsLeft <= 0) return;
  hintUsed = true;
  hintsLeft--;
  gameHintsUsed++;
  const q = questions[current];
  if (gameMode === "map") {
    const group = REGION_GROUPS[groupOf(q.correct)];
    const others = shuffle(group.filter(i => i !== q.correct)).slice(0, 2);
    mapCandidates = [q.correct, ...others];
    renderQuizMap();
  } else {
    q.eliminated = shuffle(q.opts.filter(i => i !== q.correct)).slice(0, 2);
    renderOptions();
  }
  updateHintBtn();
}

function updateHintBtn() {
  const hb = document.getElementById("hint-btn");
  const t = T[lang];
  if (hintsLeft <= 0) {
    hb.disabled = true;
    hb.innerHTML = `✗ <span>${t.hintUsed}</span>`;
  } else {
    hb.disabled = answered || hintUsed;
    hb.innerHTML = `💡 <span>${t.hintBtn} (${hintsLeft})</span>`;
  }
}

// ── Region Stats ──
function calcRegionStats() {
  const stats = {};
  questions.forEach((q, i) => {
    const region = regionData[q.correct] || "?";
    if (!stats[region]) stats[region] = { correct: 0, total: 0 };
    stats[region].total++;
    if (q._answered === true) stats[region].correct++;
  });
  return stats;
}

function renderRegionStats() {
  const card = document.getElementById("region-stats-card");
  const body = document.getElementById("rs-body");
  const stats = calcRegionStats();

  // Only show if we have data
  const regions = Object.keys(stats);
  if (!regions.length) { card.style.display = "none"; return; }
  card.style.display = "block";

  const regionColors = {
    "北海道":"#4C9BE8","東北":"#5BAD6F","関東":"#E84040","中部":"#F5A623",
    "近畿":"#9B59B6","中国":"#1ABC9C","四国":"#E67E22","九州":"#E91E63","沖縄":"#00BCD4"
  };
  const regionNamesEn = {
    "北海道":"Hokkaido","東北":"Tohoku","関東":"Kanto","中部":"Chubu",
    "近畿":"Kinki","中国":"Chugoku","四国":"Shikoku","九州":"Kyushu","沖縄":"Okinawa"
  };
  const regionNamesRu = {
    "北海道":"Хоккайдо","東北":"Тохоку","関東":"Канто","中部":"Тюбу",
    "近畿":"Кинки","中国":"Тюгоку","四国":"Сикоку","九州":"Кюсю","沖縄":"Окинава"
  };

  // Title
  const titleEl = document.getElementById("rs-title-txt");
  titleEl.textContent = lang==="ja"?"地域別成績":lang==="en"?"Results by Region":"Статистика по регионам";

  body.innerHTML = regions.map(r => {
    const { correct, total } = stats[r];
    const pct = total ? Math.round(correct/total*100) : 0;
    const color = regionColors[r] || "#888";
    const displayName = lang==="en" ? (regionNamesEn[r]||r) : lang==="ru" ? (regionNamesRu[r]||r) : r;
    const pctColor = pct >= 70 ? "#27AE60" : pct >= 40 ? "#F5A623" : "#E84040";
    return `<div class="rs-row">
      <div class="rs-name">${displayName}</div>
      <div class="rs-bar-track">
        <div class="rs-bar-fill" style="width:${pct}%;background:${color}"></div>
      </div>
      <div class="rs-pct" style="color:${pctColor}">${correct}/${total}</div>
    </div>`;
  }).join("");

function mapColors() {
  return isDark
    ? {base:"#3A4D66", dim:"#1F2B3B", stroke:"#0F1923", hover:"#5B7BA6", cand:"#F5A623"}
    : {base:"#D8D5CD", dim:"#EEECE7", stroke:"#FFFFFF", hover:"#A9B8D0", cand:"#F5C66B"};
}

// Zoom the map to a region (keeps the 850:680 shape so the layout doesn't jump)
function setMapViewBox(svg, ids) {
  if (!ids) { svg.setAttribute("viewBox", DEFAULT_VIEWBOX.join(" ")); return; }
  const path = d3.geoPath();
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  prefFeatures.forEach(f => {
    if (!ids.includes(f.id)) return;
    const [[a, b], [c, d]] = path.bounds(f);
    x0 = Math.min(x0, a); y0 = Math.min(y0, b); x1 = Math.max(x1, c); y1 = Math.max(y1, d);
  });
  if (!isFinite(x0)) { svg.setAttribute("viewBox", DEFAULT_VIEWBOX.join(" ")); return; }
  let w = (x1 - x0) * 1.15, h = (y1 - y0) * 1.15;
  const ratio = DEFAULT_VIEWBOX[2] / DEFAULT_VIEWBOX[3];
  if (w / h > ratio) h = w / ratio; else w = h * ratio;
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  svg.setAttribute("viewBox", `${cx - w/2} ${cy - h/2} ${w} ${h}`);
}

function renderQuizMap() {
  const svg = document.getElementById("jmap");
  svg.innerHTML = "";
  if (!prefFeatures.length || !questions.length) return;
  const path = d3.geoPath();
  const q = questions[current];
  const C = mapColors();
  const group = REGION_GROUPS[gameRegion];
  const isMap = gameMode === "map";
  setMapViewBox(svg, group);
  svg.classList.toggle("clickable", isMap && !answered);

  const front = []; // highlighted shapes are drawn last so their outline is on top
  prefFeatures.forEach(f => {
    const id = f.id;
    const inGroup = !group || group.includes(id);
    let fill = inGroup ? C.base : C.dim;
    let strokeW = 0.8, glow = null;

    if (!isMap) {
      if (id === q.correct) { fill = "#E84040"; strokeW = 2.5; glow = "rgba(232,64,64,0.6)"; }
    } else if (answered) {
      if (id === q.correct)      { fill = "#27AE60"; strokeW = 2.5; glow = "rgba(39,174,96,0.7)"; }
      else if (id === mapClicked) { fill = "#E84040"; strokeW = 2; }
    } else if (mapCandidates) {
      fill = mapCandidates.includes(id) ? C.cand : C.dim;
    }

    const el = document.createElementNS(SVG_NS, "path");
    el.setAttribute("d", path(f));
    el.setAttribute("fill", fill);
    el.setAttribute("stroke", C.stroke);
    el.setAttribute("stroke-width", strokeW);
    el.setAttribute("vector-effect", "non-scaling-stroke");
    if (glow) el.style.filter = `drop-shadow(0 0 8px ${glow})`;

    if (isMap && !answered) {
      el.addEventListener("mouseenter", () => el.setAttribute("fill", C.hover));
      el.addEventListener("mouseleave", () => el.setAttribute("fill", fill));
      el.addEventListener("click", () => answerMap(id));
    }
    if (glow || (answered && id === mapClicked)) front.push(el); else svg.appendChild(el);
  });
  front.forEach(el => svg.appendChild(el));
}

// ── Player helpers ──
// "Urmat", "urmat", " URMAT " → the same player
function normName(n) { return (n || "").trim().toLowerCase().replace(/\s+/g, " "); }
function gamesWord(n) {
  if (lang !== "ru") return T[lang].hGames;
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return "игра";
  if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return "игры";
  return "игр";
}
function pctClass(p) { return p >= 70 ? "great" : p >= 40 ? "ok" : "low"; }
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function groupByPlayer(hist) {
  const map = new Map();
  hist.forEach(h => {             // hist is newest-first
    const key = normName(h.name);
    if (!map.has(key)) map.set(key, { name: h.name, games: [] });
    map.get(key).games.push(h);
  });
  return [...map.values()].map(pl => {
    const pcts = pl.games.map(g => g.score / g.total);
    pl.avg = Math.round(pcts.reduce((a, b) => a + b, 0) / pcts.length * 100);
    pl.best = pl.games.reduce((b, g) => (g.score / g.total > b.score / b.total ? g : b));
    return pl;
  });
}

}

// ── Quiz logic ──
// Fisher–Yates shuffle (fair, unlike sort(random))
function shuffle(a) {
  const r = [...a];
  for (let i = r.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [r[i], r[j]] = [r[j], r[i]];
  }
  return r;
}

// Pick n items without repeats; items with bigger weight are picked more often
function weightedPick(items, n, weightFn) {
  const pool = [...items], out = [];
  while (out.length < n && pool.length) {
    const ws = pool.map(weightFn);
    let r = Math.random() * ws.reduce((a, b) => a + b, 0);
    let i = 0;
    for (; i < pool.length - 1; i++) { r -= ws[i]; if (r <= 0) break; }
    out.push(pool.splice(i, 1)[0]);
  }
  return out;
}

// 苦手モード weight: many mistakes → high weight, never asked → slightly higher than normal
function weakWeight(s) {
  if (!s) return 1.5;
  return (1 + s.w * 3) / (1 + s.c);
}

function buildQuestions() {
  const all = Object.keys(prefData);
  const pool = REGION_GROUPS[gameRegion] || all;
  totalQ = Math.min(diffQ, pool.length);
  let picked;
  if (weakFirst) {
    const st = getPrefStats(playerName);
    picked = weightedPick(pool, totalQ, id => weakWeight(st[id]));
  } else {
    picked = shuffle(pool).slice(0, totalQ);
  }
  // In a region quiz the wrong options come from the same region (harder, more useful)
  const distractFrom = gameRegion !== "all" ? pool : all;
  questions = picked.map(id => {
    const wrong = shuffle(distractFrom.filter(i => i !== id)).slice(0, 3);
    return { correct: id, opts: shuffle([id, ...wrong]), eliminated: [], picked: null };
  });
}

// 4択 answer
function answer(id) {
  if (answered) return;
  questions[current].picked = id;
  finishAnswer(id === questions[current].correct, id);
}

// Map-mode answer
function answerMap(id) {
  if (answered) return;
  mapClicked = id;
  questions[current].picked = id;
  finishAnswer(id === questions[current].correct, id);
}

// Shared by 4択, map mode and timeout
function finishAnswer(ok, pickedId, timedOut = false) {
  answered = true;
  stopTimer();
  const t = T[lang];
  const q = questions[current];
  q._answered = ok;
  totalAnswerTime += Math.min(timerMax, (Date.now() - qStartTime) / 1000);
  recordPref(q.correct, ok);

  const correctName = prefData[q.correct][lang];
  const fb = document.getElementById("feedback");
  if (ok) {
    score++;
    fb.textContent = t.correct;
    fb.className = "ok";
    soundCorrect();
    launchConfetti();
  } else {
    if (timedOut) {
      fb.textContent = t.timeout + " " + correctName;
      soundTimeout();
    } else if (gameMode === "map") {
      fb.textContent = t.mapWrong.replace("{x}", prefData[pickedId][lang]) + " " + correctName;
      soundWrong();
    } else {
      fb.textContent = t.wrong + " " + correctName;
      soundWrong();
    }
    fb.className = "fail";
  }
  updateStreak(ok);

  if (gameMode === "map") renderQuizMap(); else renderOptions();
  updateHintBtn();
  renderInfoCard();
  updateTopBar();
  document.getElementById("next-btn").style.display = "block";
}

function startQuestion() {
  answered = false;
  hintUsed = false;
  mapClicked = null;
  mapCandidates = null;
  const fb = document.getElementById("feedback");
  fb.textContent = "";
  fb.className = "";
  document.getElementById("next-btn").style.display = "none";
  document.getElementById("info-card").style.display = "none";
  updateHintBtn();
  renderQuestion();
  updateTopBar();
  qStartTime = Date.now();
  startTimer();
}

function nextQ() {
  current++;
  if (current >= totalQ) { showResult(); return; }
  startQuestion();
  document.getElementById("quiz-screen").scrollIntoView({ behavior: "smooth", block: "start" });
}

  {id:"perfect",  icon:"💯", ja:["パーフェクト","1ゲームで全問正解"],                     en:["Perfect","Get every question right in one game"],               ru:["Идеально","Все ответы верные за одну игру"]},
  {id:"streak5",  icon:"🔥", ja:["連続5問","5問連続で正解"],                              en:["On Fire","5 correct answers in a row"],                          ru:["В ударе","5 верных ответов подряд"]},
  {id:"streak10", icon:"⚡", ja:["連続10問","10問連続で正解"],                            en:["Unstoppable","10 correct answers in a row"],                     ru:["Неудержимый","10 верных ответов подряд"]},
  {id:"hard",     icon:"🏔️", ja:["全国制覇","むずかしい（47問）で70%以上"],               en:["Nationwide","70%+ on Hard (all 47)"],                            ru:["Вся страна","70%+ на сложном уровне (все 47)"]},
  {id:"nohint",   icon:"🧠", ja:["ヒント不要","ヒントなしで80%以上（10問以上）"],          en:["No Hints Needed","80%+ without hints (10+ questions)"],          ru:["Без подсказок","80%+ без подсказок (10+ вопросов)"]},
  {id:"speed",    icon:"⏱️", ja:["スピードスター","平均5秒以内・70%以上"],                 en:["Speedster","70%+ with under 5 s per answer on average"],         ru:["Скорострел","70%+ и в среднем меньше 5 сек на ответ"]},
  {id:"mapper",   icon:"🗺️", ja:["地図マスター","地図モードで80%以上（10問以上）"],        en:["Map Master","80%+ in Find-on-Map mode (10+ questions)"],         ru:["Мастер карты","80%+ в режиме «На карте» (10+ вопросов)"]},
  {id:"region",   icon:"📍", ja:["地域の達人","地域クイズで全問正解"],                    en:["Local Expert","Perfect score in a region quiz"],                 ru:["Знаток региона","Всё верно в квизе по региону"]},
  {id:"all47",    icon:"🗾", ja:["コンプリート","47都道府県すべてに1回以上正解"],          en:["Collector","Answer all 47 prefectures correctly at least once"], ru:["Коллекционер","Хотя бы раз верно ответь по всем 47 префектурам"]},
  {id:"games10",  icon:"🎮", ja:["常連さん","10回プレイ"],                                en:["Regular","Play 10 games"],                                       ru:["Завсегдатай","Сыграй 10 игр"]},

function loadAllAch() {
  try { return JSON.parse(localStorage.getItem("jmq_ach")) || {}; } catch(e) { return {}; }
}
function getAch(name) { return loadAllAch()[normName(name)] || {}; }

function unlock(id) {
  try {
    const all = loadAllAch();
    const k = normName(playerName);
    all[k] = all[k] || {};
    if (all[k][id]) return;
    const now = new Date();
    all[k][id] = now.toLocaleDateString("ja-JP", {year:"numeric", month:"2-digit", day:"2-digit"});
    localStorage.setItem("jmq_ach", JSON.stringify(all));
  } catch(e) { return; }
  const a = ACH.find(x => x.id === id);
  newAchievements.push(a);
  showToast(a);
}

function checkEndAchievements() {
  const pct = score / totalQ;
  const avgTime = totalAnswerTime / totalQ;
  unlock("first");
  if (pct === 1) unlock("perfect");
  if (diffQ === 47 && gameRegion === "all" && pct >= 0.7) unlock("hard");
  if (gameHintsUsed === 0 && totalQ >= 10 && pct >= 0.8) unlock("nohint");
  if (avgTime <= 5 && totalQ >= 5 && pct >= 0.7) unlock("speed");
  if (gameMode === "map" && totalQ >= 10 && pct >= 0.8) unlock("mapper");
  if (gameRegion !== "all" && pct === 1) unlock("region");
  const st = getPrefStats(playerName);
  if (Object.keys(prefData).every(id => st[id] && st[id].c > 0)) unlock("all47");
  if (gamesPlayed(playerName) >= 10) unlock("games10");
}

function gamesPlayed(name) {
  try {
    return (JSON.parse(localStorage.getItem("jmq_history")) || []).filter(h => normName(h.name) === normName(name)).length;
  } catch(e) { return 0; }
}

// Toast popup, one after another
let toastQueue = [], toastBusy = false;
function showToast(a) { toastQueue.push(a); if (!toastBusy) nextToast(); }
function nextToast() {
  const a = toastQueue.shift();
  if (!a) { toastBusy = false; return; }
  toastBusy = true;
  const el = document.createElement("div");
  el.className = "toast";
  el.innerHTML = `<div class="t-ic">${a.icon}</div><div><div class="t-top">${T[lang].achUnlocked}</div><div class="t-name">${a[lang][0]}</div></div>`;
  document.getElementById("toast-wrap").appendChild(el);
  playTone(784, "sine", 0.12, 0.12); playTone(1047, "sine", 0.25, 0.12, 0.12);
  setTimeout(() => { el.classList.add("out"); setTimeout(() => { el.remove(); nextToast(); }, 300); }, 2600);
}

function renderNewAchievements() {
  const card = document.getElementById("new-ach-card");
  if (!newAchievements.length) { card.style.display = "none"; return; }
  card.style.display = "block";
  setText("new-ach-title", T[lang].achNew);
  setHTML("new-ach-body", newAchievements.map(a =>
    `<div class="rs-row"><span style="font-size:22px">${a.icon}</span><div><b>${a[lang][0]}</b><div style="font-size:12px;color:var(--text-muted)">${a[lang][1]}</div></div></div>`
  ).join(""));
}

function openAchModal() {
  const t = T[lang];
  const name = profileName();
  const got = getAch(name);
  const st = getPrefStats(name);
  const count = ACH.filter(a => got[a.id]).length;
  setHTML("ach-title", `${t.achTitle} — ${escapeHtml(name)} <span class="ach-count">${count}/${ACH.length}</span>`);
  const progressOf = id => {
    if (id === "all47") return [Object.keys(prefData).filter(p => st[p] && st[p].c > 0).length, 47];
    if (id === "games10") return [Math.min(10, gamesPlayed(name)), 10];
    return null;
  };
  setHTML("ach-body", `<div class="ach-grid">${ACH.map(a => {
    const date = got[a.id];
    const pr = !date && progressOf(a.id);
    return `<div class="ach-card ${date ? "got" : "locked"}">
      <div class="a-ic">${date ? a.icon : "🔒"}</div>
      <div style="flex:1;min-width:0">
        <div class="a-name">${a[lang][0]}</div>
        <div class="a-desc">${a[lang][1]}</div>
        ${date ? `<div class="a-date">✓ ${date}</div>` : ""}
        ${pr ? `<div class="ach-bar"><div style="width:${pr[0] / pr[1] * 100}%"></div></div><div class="a-desc">${pr[0]} / ${pr[1]}</div>` : ""}
      </div>
    </div>`;
  }).join("")}</div>`);
  document.getElementById("ach-modal").classList.add("open");
}
function closeAchModal() { document.getElementById("ach-modal").classList.remove("open"); }

// ── History ──
function saveHistory(sc, total) {
  try {
    const key = "jmq_history";
    let hist = [];
    try { hist = JSON.parse(localStorage.getItem(key)) || []; } catch(e){}
    const now = new Date();
    const dateStr = now.toLocaleDateString("ja-JP",{month:"2-digit",day:"2-digit"}) + " " + now.toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"});
    hist.unshift({ date: dateStr, score: sc, total, name: playerName, mode: gameMode, region: gameRegion });
    if (hist.length > 100) hist = hist.slice(0, 100);
    localStorage.setItem(key, JSON.stringify(hist));
    return hist;
  } catch(e){ return []; }
}

function renderHistory() {
  let hist = [];
  try { hist = JSON.parse(localStorage.getItem("jmq_history")) || []; } catch(e){}
  const card = document.getElementById("history-card");
  const list = document.getElementById("history-list");
  const t = T[lang];
  // Result screen: only this player's games
  hist = hist.filter(h => normName(h.name) === normName(playerName)).slice(0, 10);
  if (!hist.length) { card.style.display = "none"; return; }
  card.style.display = "block";
  document.getElementById("history-title-txt").textContent = t.historyTitle + " — " + playerName;
  list.innerHTML = hist.map(h => {
    const pct = Math.round(h.score / h.total * 100);
    const cls = pct >= 70 ? "great" : pct >= 40 ? "ok" : "low";
    return `<div class="history-row">
      <span class="history-date">${h.date}</span>
      ${gameTag(h)}
      <span class="history-pct ${cls}">${pct}%</span>
      <span class="history-score">${h.score}/${h.total}</span>
    </div>`;
  }).join("");
}

// ── Result + Leaderboard ──
async function showResult() {
  stopTimer();
  show("result-screen");
  const t = T[lang];
  const pct = Math.round(score/totalQ*100);
  document.getElementById("res-score").textContent = score;
  document.getElementById("res-denom").textContent = "/ " + totalQ;
  document.getElementById("res-sub").textContent = t.resAccuracy + ": " + pct + "%";
  let msg = pct===100 ? t.resMsg10 : pct>=70 ? t.resMsg7 : pct>=40 ? t.resMsg4 : t.resMsgFail;
  document.getElementById("res-msg").textContent = msg;
  if (pct >= 70) launchConfetti();

  saveHistory(score, totalQ);
  checkEndAchievements();
  renderNewAchievements();
  renderRegionStats();
  renderHistory();

  if (window.storage) {
    try {
      const key = "lb:" + normName(playerName).slice(0,20);
      let prev = 0;
      try { const ex = await window.storage.get(key, true); if(ex) prev = JSON.parse(ex.value).score; } catch(e){}
      if (score > prev) await window.storage.set(key, JSON.stringify({name:playerName, score, total:totalQ}), true);
    } catch(e){}
    await renderLeaderboard();
    try {
      const all = await window.storage.list("lb:", true);
      document.getElementById("s-players").textContent = all.keys.length;
    } catch(e){}
  }
}

async function renderLeaderboard() {
  if (!window.storage) return;
  let keys = [];
  try { const r = await window.storage.list("lb:", true); keys = r.keys; } catch(e){ return; }
  const entries = [];
  for (const k of keys) {
    try { const r = await window.storage.get(k, true); if(r) entries.push(JSON.parse(r.value)); } catch(e){}
  }
  entries.sort((a,b)=>b.score-a.score);
  const top = entries.slice(0,10);
  const rankClass = (i) => i===0?"gold":i===1?"silver":i===2?"bronze":"";
  let html = top.map((e,i)=>`
    <div class="lb-row${normName(e.name)===normName(playerName)?" me":""}">
      <span class="lb-rank ${rankClass(i)}">${i===0?"🥇":i===1?"🥈":i===2?"🥉":i+1}</span>
      <span class="lb-name">${escapeHtml(e.name)}</span>
      <span class="lb-sc">${e.score}/${e.total||10}</span>
    </div>`).join("");
  if (!html) html = `<div class="lb-row"><span style="color:var(--text-muted);font-size:13px;padding:4px 0">まだ記録なし — Be the first!</span></div>`;
  document.getElementById("leaderboard").innerHTML = html;
}

// ── Navigation ──
function show(id) {
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("visible"));
  document.getElementById(id).classList.add("visible");
}

function initQuiz() {
  buildQuestions();
  current = 0; score = 0; streak = 0; bestStreak = 0;
  totalAnswerTime = 0; gameHintsUsed = 0; newAchievements = [];
  hintsLeft = hintsByDiff[diffQ] || 1;
  timerMax = gameMode === "map" ? 20 : 15;   // clicking the map takes a bit longer
  document.getElementById("streak-badge").className = "streak-badge";
  document.getElementById("quiz-screen").classList.toggle("map-mode", gameMode === "map");
  startQuestion();
}

async function startQuiz() {
  playerName = document.getElementById("name-input").value.trim() || "Player";
  show("quiz-screen");
  initQuiz();
}

function restartQuiz() {
  show("quiz-screen");
  initQuiz();
}

function goHome() {
  stopTimer();
  show("start-screen");
  if (window.storage) {
    window.storage.list("lb:", true).then(r => {
      document.getElementById("s-players").textContent = r.keys.length;
    }).catch(()=>{});
  }
}

      isDark = true;
      document.documentElement.setAttribute("data-theme","dark");

                 en:"Could not load the map. Check your internet connection and reload the page.",
